<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Taller interactivo de ajedrez</title>
<style>
body{font-family:system-ui,sans-serif;background:#f2f5fa;color:#202938;margin:0;padding:20px}.app{max-width:760px;margin:auto;background:white;padding:24px;border-radius:18px;box-shadow:0 6px 24px #0001}h1{margin-top:0}.muted{color:#667085}.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin:22px 0}.tab,.option,.reset{font:inherit;cursor:pointer;border:1px solid #ccd5e2;border-radius:11px;background:white;padding:10px}.tab.active{background:#e5efff;border:2px solid #3975d7}.tab.done{border-color:#238653}.sym{display:block;font-size:1.8rem}.tab small{font-size:.72rem}.meta,.scoreline{display:flex;justify-content:space-between}.piece{text-align:center;font-size:4.5rem;margin:12px}.question{font-size:1.2rem;font-weight:650;margin:16px 0}.options{display:grid;gap:9px}.option{text-align:left;padding:14px}.option:disabled{cursor:default}.option.correct{background:#e9f8ef;border:2px solid #238653}.option.wrong{background:#fff0f0;border:2px solid #c44b4b}.feedback{background:#f1f5f9;padding:15px;border-radius:12px;margin-top:15px;line-height:1.5}.next{display:block;margin-top:12px;padding:11px 16px;border:0;border-radius:9px;background:#245db5;color:white;font:inherit;cursor:pointer}.scoreline{margin-top:22px;font-weight:650}.track{height:9px;background:#e5eaf1;border-radius:20px;margin-top:8px;overflow:hidden}.fill{height:100%;background:#24945b;width:0}.reset{width:100%;margin-top:18px}@media(max-width:520px){body{padding:10px}.app{padding:15px}.tabs{gap:4px}.tab{padding:6px 1px}.tab small{font-size:.62rem}.sym{font-size:1.45rem}}
</style></head><body><main class="app">
<h1>♟ Mi taller interactivo de ajedrez</h1><p class="muted">Seis juegos para aprender cómo se mueve cada pieza. Elige una respuesta y comprueba si has acertado.</p>
<nav class="tabs" id="tabs" aria-label="Juegos por pieza"></nav>
<section><div class="meta"><span id="number"></span><span id="done"></span></div><div class="piece" id="piece"></div><div class="question" id="question"></div><div class="options" id="options"></div><div id="feedback" aria-live="polite"></div></section>
<div class="scoreline"><span>Puntuación</span><span id="score">0/6</span></div><div class="track"><div class="fill" id="fill"></div></div><button class="reset" id="reset">↻ Reiniciar todos los juegos</button>
</main><script>
const games=[
{name:"Peón",s:"♙",q:"¿Cómo se mueve un peón cuando no tiene ninguna pieza delante?",o:["Una casilla hacia delante","En diagonal","Hacia atrás"],a:0,e:"El peón avanza una casilla hacia delante. En su primer movimiento puede avanzar dos casillas si están libres."},
{name:"Torre",s:"♖",q:"¿Por dónde puede moverse la torre?",o:["En diagonal","En horizontal y vertical","En forma de L"],a:1,e:"La torre se mueve en línea recta, horizontal o verticalmente, tantas casillas como estén libres."},
{name:"Alfil",s:"♗",q:"¿Cómo se mueve el alfil?",o:["En diagonal","Solo hacia delante","En horizontal y vertical"],a:0,e:"El alfil siempre se mueve en diagonal y permanece en casillas del mismo color."},
{name:"Dama",s:"♕",q:"¿Qué movimientos puede hacer la dama?",o:["Solo en diagonal","Como la torre y el alfil","En forma de L"],a:1,e:"La dama combina los movimientos de la torre y del alfil: horizontal, vertical y diagonal."},
{name:"Caballo",s:"♘",q:"¿Qué forma tiene el movimiento del caballo?",o:["Una línea recta","Una diagonal larga","Una L"],a:2,e:"El caballo se mueve en forma de L: dos casillas en una dirección y una hacia un lado. Además, puede saltar piezas."},
{name:"Rey",s:"♔",q:"¿Cuántas casillas puede moverse el rey en cada jugada?",o:["Una casilla en cualquier dirección","Tres casillas","Dos casillas en diagonal"],a:0,e:"El rey se mueve una casilla en cualquier dirección, siempre que la casilla no esté amenazada."}
];
let current=0,score=0,done=new Set(),answered=false;const el=id=>document.getElementById(id);
function draw(){
 const g=games[current];answered=false;el("tabs").innerHTML="";
 games.forEach((x,i)=>{let b=document.createElement("button");b.className="tab"+(i===current?" active":"")+(done.has(i)?" done":"");b.innerHTML='<span class="sym">'+x.s+'</span><small>'+x.name+(done.has(i)?" ✓":"")+'</small>';b.onclick=()=>{current=i;draw()};el("tabs").append(b)});
 el("number").textContent=`Juego ${current+1} de 6`;el("done").textContent=`${done.size} de 6 superados`;el("piece").textContent=g.s;el("question").textContent=g.q;el("feedback").innerHTML="";el("options").innerHTML="";
 g.o.forEach((v,i)=>{let b=document.createElement("button");b.className="option";b.textContent=String.fromCharCode(65+i)+". "+v;b.onclick=()=>answer(i);el("options").append(b)});
 el("score").textContent=score+"/6";el("fill").style.width=(score/6*100)+"%";
}
function answer(i){
 if(answered)return;answered=true;let g=games[current],right=i===g.a;
 [...el("options").children].forEach((b,j)=>{b.disabled=true;if(j===g.a)b.classList.add("correct");if(j===i&&!right)b.classList.add("wrong")});
 if(right&&!done.has(current)){score++;done.add(current)}
 let box=document.createElement("div");box.className="feedback";let strong=document.createElement("strong");strong.textContent=right?"✓ ¡Respuesta correcta!":"¡Buen intento! Vamos a aprender.";box.append(strong,document.createTextNode(g.e));
 let next=document.createElement("button");next.className="next";next.textContent=current===5?"Volver al primer juego":"Siguiente juego →";next.onclick=()=>{current=(current+1)%6;draw()};box.append(next);el("feedback").append(box);
 el("done").textContent=done.size+" de 6 superados";el("score").textContent=score+"/6";el("fill").style.width=(score/6*100)+"%";drawTabs();
}
function drawTabs(){[...el("tabs").children].forEach((b,i)=>{b.classList.toggle("done",done.has(i));b.classList.toggle("active",i===current);b.querySelector("small").textContent=games[i].name+(done.has(i)?" ✓":"")})}
el("reset").onclick=()=>{current=0;score=0;done=new Set();draw()};draw();
</script></body></html>
